basePath: /
definitions:
  handlers.AuthResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.RegisterLoginRequest:
    properties:
      company_name:
        type: string
      email:
        type: string
      full_name:
        type: string
      phone:
        type: string
    required:
    - email
    type: object
  handlers.SancionResponse:
    properties:
      data: {}
      message:
        example: RFC validated successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  handlers.ValidarRFCRequest:
    properties:
      rfc:
        example: SIR130227V77
        type: string
    required:
    - rfc
    type: object
  handlers.VerifyPasscodeRequest:
    properties:
      code:
        maxLength: 8
        minLength: 6
        type: string
      device_name:
        type: string
      fingerprint_data:
        type: string
    required:
    - code
    - fingerprint_data
    type: object
  models.ErrorResponse:
    properties:
      error:
        example: 'provider not found: UNKNOWN'
        type: string
    type: object
  models.HealthResponse:
    properties:
      service:
        example: validafianza-api
        type: string
      status:
        example: ok
        type: string
    type: object
  models.ProvidersResponse:
    properties:
      providers:
        example:
        - MAPFRE
        - BERKLEY_MEXICO_FIANZAS
        - SOFIMEX
        items:
          type: string
        type: array
    type: object
  models.ValidationRequest:
    properties:
      force_refresh:
        description: Skip cache and force a fresh scrape
        example: false
        type: boolean
      lookup_key:
        description: Policy number / línea de validación
        example: "0032400003909000000491774"
        type: string
      provider_key:
        description: Afianzadora key — must match a registered provider
        example: MAPFRE
        type: string
    type: object
  models.ValidationResponse:
    properties:
      cached_at:
        description: When the result was served from cache
        type: string
      data:
        additionalProperties: true
        description: Provider-specific structured data
        type: object
      html_extraido:
        description: Raw HTML fragments extracted from the provider page
        items:
          type: string
        type: array
      mensaje:
        description: Human-readable result message
        example: Póliza validada exitosamente en MAPFRE
        type: string
      no_valido:
        description: True when the policy could not be validated
        example: false
        type: boolean
      scraped_at:
        description: When the scrape was performed
        type: string
      valido:
        description: True when the policy is valid and active
        example: true
        type: boolean
    type: object
host: localhost:3000
info:
  contact:
    name: Validafianza
  description: API para validación de pólizas de fianza de afianzadoras mexicanas.
  license:
    name: Private
  title: Validafianza API
  version: "1.0"
paths:
  /api/auth/logout:
    post:
      description: Terminates the authenticated user's session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/auth/profile:
    get:
      description: Returns the authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - auth
  /api/auth/register-or-login:
    post:
      consumes:
      - application/json
      description: Sends a one-time passcode to the user's email. Creates user if
        doesn't exist.
      parameters:
      - description: User email and optional info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
      summary: Register or login with email
      tags:
      - auth
  /api/auth/verify:
    post:
      consumes:
      - application/json
      description: Validates the one-time passcode and returns authentication token
      parameters:
      - description: Passcode and device info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.VerifyPasscodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
      summary: Verify passcode
      tags:
      - auth
  /api/v1/polizas/providers:
    get:
      description: Returns the keys of all afianzadoras currently registered and available
        for validation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProvidersResponse'
      summary: List supported providers
      tags:
      - polizas
  /api/v1/polizas/validate:
    post:
      consumes:
      - application/json
      description: Scrapes the afianzadora website and returns the validation result.
        Results are cached for CACHE_TTL_HOURS. Use force_refresh=true to bypass cache.
      parameters:
      - description: Validation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ValidationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ValidationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Validate fianza policy
      tags:
      - polizas
  /api/v1/sanciones/scg:
    post:
      consumes:
      - application/json
      description: Checks if an RFC is sanctioned by SCG (CDMX Comptroller). Results
        are cached for CACHE_TTL_HOURS.
      parameters:
      - description: RFC to validate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ValidarRFCRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SancionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.SancionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.SancionResponse'
      security:
      - BearerAuth: []
      summary: Validate RFC against SCG sanctions
      tags:
      - sanciones
  /api/v1/sanciones/sfp:
    post:
      consumes:
      - application/json
      description: 'Checks if an RFC is sanctioned by SFP (Public Function). Results
        are cached for CACHE_TTL_HOURS. Note: This endpoint uses browser automation
        and may take 60-90 seconds.'
      parameters:
      - description: RFC to validate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ValidarRFCRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SancionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.SancionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.SancionResponse'
      security:
      - BearerAuth: []
      summary: Validate RFC against SFP sanctions
      tags:
      - sanciones
  /health:
    get:
      description: Returns service liveness. Does not check DB — use for load balancer
        probes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Health check
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
