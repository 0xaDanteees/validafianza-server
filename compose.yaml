services:
  postgres:
    image: postgres:17-alpine
    container_name: validafianza-postgres-${ENV:-dev}
    environment:
      - ENV=${ENV:-dev}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/seeders/providers.sql:/docker-entrypoint-initdb.d/02-providers.sql
      - ./db/migrations/001_auth_tables.sql:/docker-entrypoint-initdb.d/03-auth-tables.sql
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "wal_buffers=4MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - validafianza-network
    restart: unless-stopped
  
  api: 
    build:
      context: .
      dockerfile: DockerFile
    container_name: validafianza-api-${ENV:-dev}
    environment:
      - ENV=${ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      - PORT=${PORT}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-60}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - CACHE_TTL_HOURS=${CACHE_TTL_HOURS:-24}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-7}
      - PASSCODE_TTL_MINUTES=${PASSCODE_TTL_MINUTES:-10}
      - MAX_DEVICES_PER_USER=${MAX_DEVICES_PER_USER:-3}
    ports:
      - ${PORT}:${PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - validafianza-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
networks:
  validafianza-network:
    driver: bridge